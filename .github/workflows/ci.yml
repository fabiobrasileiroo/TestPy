name: Run tests and publish Allure report

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9.2"

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests (generate allure-results)
        run: |
          mkdir -p allure-results
          python -m pytest --alluredir=allure-results tests/ -v

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results
          path: allure-results/
          retention-days: 7

  publish-report:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: allure-results/

      - name: Install Java (Allure requirement)
        run: sudo apt-get update && sudo apt-get install -y default-jre

      - name: Install Allure CLI
        run: |
          ALLURE_VER=2.22.0
          wget https://repo.maven.apache.org/maven2/io/qameta/allure/allure-commandline/$ALLURE_VER/allure-commandline-$ALLURE_VER.tgz
          tar -xzf allure-commandline-$ALLURE_VER.tgz -C /tmp
          echo "/tmp/allure-$ALLURE_VER/bin" >> $GITHUB_PATH
          allure --version

      - name: Generate Allure report
        run: |
          if [ -d "./allure-results" ] && [ "$(ls -A ./allure-results)" ]; then
            mkdir -p docs
            allure generate ./allure-results -o ./docs --clean
          else
            echo "No allure-results found, skipping report generation"
            exit 1
          fi

      - name: Commit and push report to main (docs folder)
        uses: EndBug/add-and-commit@v9
        with:
          add: docs
          message: "Update Allure report [skip ci]"
          new_branch: main
          push: true
