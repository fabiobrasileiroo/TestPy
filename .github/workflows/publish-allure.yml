name: Run tests and publish Allure report

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          # Compatível com Python 3.8+ localmente
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install pytest; fi
          # Garantir instalação da integração Allure para pytest
          pip install allure-pytest

      - name: Run tests (generate allure-results)
        run: |
          # Ajuste o comando abaixo se necessário
          pytest -q --maxfail=1 --disable-warnings --alluredir=allure-results || true

      - name: Install Java (Allure requirement)
        run: sudo apt-get update && sudo apt-get install -y default-jre

      - name: Install Allure CLI
        run: |
          ALLURE_VER=2.22.0
          wget https://repo.maven.apache.org/maven2/io/qameta/allure/allure-commandline/$ALLURE_VER/allure-commandline-$ALLURE_VER.tgz
          tar -xzf allure-commandline-$ALLURE_VER.tgz -C /tmp
          echo "/tmp/allure-$ALLURE_VER/bin" >> $GITHUB_PATH
          allure --version

      - name: Generate Allure report
        run: |
          if [ -d "./allure-results" ] && [ "$(ls -A ./allure-results)" ]; then
            mkdir -p docs
            allure generate ./allure-results -o ./docs --clean
          else
            echo "No allure-results found, skipping report generation"
            exit 1
          fi

      - name: Commit and push report to main (docs folder)
        uses: EndBug/add-and-commit@v9
        with:
          add: docs
          message: "Update Allure report"
          new_branch: main
          push: true
